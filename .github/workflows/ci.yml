name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull request runs cancel. Other runs group by commit, so a newer
  # main push never replaces a queued run: every release commit needs its own
  # CI result before the Tag release workflow tags it.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Incremental artifacts are large and useless in a restored cache.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure test directory
        run: echo "CODEX_COMMIT_TEST_TMPDIR=$RUNNER_TEMP/codex-commit-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # The repository allows only GitHub-owned actions, so cache with actions/cache.
      # Pull requests restore main's cache; only main saves.
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Run Rust workspace tests
        run: make test
      - name: Verify staged installation
        shell: sh
        run: |
          set -eu
          staging="$RUNNER_TEMP/codex-commit-install"
          make install PREFIX=/usr/local DESTDIR="$staging"
          executable="$staging/usr/local/bin/codex-commit"
          test -x "$executable"
          cmp target/release/codex-commit "$executable"
          "$executable" --help
          "$executable" --version
          "$executable" --completions zsh > "$RUNNER_TEMP/expected-completion"
          cmp "$RUNNER_TEMP/expected-completion" "$staging/usr/local/share/zsh/site-functions/_codex-commit"
          test -s "$staging/usr/local/share/bash-completion/completions/codex-commit"
          test -s "$staging/usr/local/share/fish/vendor_completions.d/codex-commit.fish"
      - name: Save Cargo cache from main
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # The repository allows only GitHub-owned actions, so cache with actions/cache.
      # Pull requests restore main's cache; only main saves.
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: cargo-lint-${{ runner.os }}-${{ runner.arch }}-
      - name: Check formatting and Clippy
        run: make check
      - name: Verify minimum supported Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check -p codex-commit --locked
      - name: Verify Cargo package
        run: cargo publish -p codex-commit --dry-run --locked
      - name: Save Cargo cache from main
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
