name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.13'
          enable-cache: false
      - name: Run integration tests
        run: make test
      - name: Verify staged installation
        shell: sh
        run: |
          set -eu
          staging="$RUNNER_TEMP/codex-commit-install"
          make install PREFIX=/usr/local DESTDIR="$staging"
          executable="$staging/usr/local/bin/codex-commit"
          test -x "$executable"
          cmp bin/codex-commit "$executable"
          "$executable" --help
          "$executable" --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ShellCheck is installed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y shellcheck
          fi
      - name: Lint shell script
        run: make lint
