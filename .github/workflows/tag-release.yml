name: Tag release

# Tags a merged release commit once main CI has passed on it; the tag push
# starts the Release workflow. Commits that keep the version are ignored.
on:
  # Only successful push runs on this repository's protected main reach the
  # jobs below, so no pull request code runs here, and the job holding the
  # App token runs only git.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  plan:
    name: Check for an untagged release commit
    if: >-
      github.repository == 'syz51/codex-commit' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Identify the release tag
        id: plan
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          cargo xtask release-tag > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  tag:
    name: Push the release tag
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Create a token scoped to this repository
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: syz51
          repositories: codex-commit
          permission-contents: write
      - name: Push an annotated tag at the checked commit
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bot_id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$RELEASE_SHA"
          gh auth setup-git --hostname github.com
          # An App-authenticated tag push starts the Release workflow; a
          # non-forced push refuses to replace an existing tag.
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Tagged $RELEASE_TAG at $RELEASE_SHA; the Release workflow publishes it." >> "$GITHUB_STEP_SUMMARY"
