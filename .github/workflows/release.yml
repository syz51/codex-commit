name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          version="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test "$actual" = "$version"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build native release binary
        run: cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Verify and package native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/$RELEASE_TARGET/release/codex-commit"
          test "$(lipo -archs "$binary")" = "$RELEASE_ARCH"
          "$binary" --help
          test "$("$binary" --version)" = "codex-commit ${GITHUB_REF_NAME#v}"
          scripts/package-release.sh "$RELEASE_TARGET" "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create release draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum -- *.tar.gz > SHA256SUMS
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo "Refusing to replace a published release" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes ./*.tar.gz SHA256SUMS
          fi
