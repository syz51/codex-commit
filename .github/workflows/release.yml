name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Verify stable tag and source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo xtask verify-release-tag --tag "$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          jq -e --arg sha "$GITHUB_SHA" \
            --argjson required '["Lint","Test (ubuntu-latest)","Test (macos-latest)","Test (macos-15-intel)"]' '
            [.[].check_runs[] | select(.app.id == 15368 and .head_sha == $sha)] as $runs
            | $required | all(.[]; . as $name
              | [$runs[] | select(.name == $name)] | sort_by(.started_at, .id) | last
              | .status == "completed" and .conclusion == "success")
          ' "$RUNNER_TEMP/checks.json"

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Verify release tag
        run: cargo xtask verify-release-tag --tag "$GITHUB_REF_NAME"
      - name: Build native release binary
        run: cargo build -p codex-commit --release --locked --target "$RELEASE_TARGET"
      - name: Verify and package native binary
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/$RELEASE_TARGET/release/codex-commit"
          test "$(lipo -archs "$binary")" = "$RELEASE_ARCH"
          "$binary" --help
          test "$("$binary" --version)" = "codex-commit ${GITHUB_REF_NAME#v}"
          cargo xtask package --target "$RELEASE_TARGET" --version "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Prepare release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.assets.outputs.release_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cargo xtask checksums --version "${GITHUB_REF_NAME#v}" --dir dist
      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]' \
            "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/matching-releases.json"
          case "$(jq length "$RUNNER_TEMP/matching-releases.json")" in
            0) printf '{}\n' > "$RUNNER_TEMP/release.json"
               echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            1) jq '.[0]' "$RUNNER_TEMP/matching-releases.json" > "$RUNNER_TEMP/release.json"
               jq -e --arg tag "$GITHUB_REF_NAME" \
                 '.tag_name == $tag and .prerelease == false and (.id | type == "number") and (.draft | type == "boolean")' \
                 "$RUNNER_TEMP/release.json"
               echo "published=$(jq -r '.draft | not' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT" ;;
            *) echo "Multiple releases matched $GITHUB_REF_NAME; refusing ambiguous release" >&2; exit 1 ;;
          esac
      - name: Verify and reuse an already published immutable release
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.immutable == true' "$RUNNER_TEMP/release.json"
          gh release verify "$GITHUB_REF_NAME"
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published"
          cp "$RUNNER_TEMP/published/SHA256SUMS" "$RUNNER_TEMP/original-SHA256SUMS"
          cargo xtask checksums --version "${GITHUB_REF_NAME#v}" --dir "$RUNNER_TEMP/published"
          cmp "$RUNNER_TEMP/original-SHA256SUMS" "$RUNNER_TEMP/published/SHA256SUMS"
          for asset in "$RUNNER_TEMP/published/"*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset"
          done
          cp "$RUNNER_TEMP/published/"* dist/
      - name: Create or repair unpublished draft
        if: steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes ./*.tar.gz SHA256SUMS
          fi
      - name: Require the exact public asset set
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/releases/$release_id" | jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$release_id" '
            .id == $id and .tag_name == $tag and .prerelease == false and
            ([.assets[].name] | sort == (["SHA256SUMS",
              "codex-commit-\($tag)-aarch64-apple-darwin.tar.gz",
              "codex-commit-\($tag)-x86_64-apple-darwin.tar.gz"] | sort))
          '
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  cargo:
    name: Publish and verify Cargo package
    needs: [validate, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure build and test directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          echo "CODEX_COMMIT_TEST_TMPDIR=$RUNNER_TEMP/codex-commit-tests" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compile and verify package before requesting credentials
        run: |
          cargo publish -p codex-commit --dry-run --locked
          cargo build -p codex-commit --example mock-codex --locked
          cargo test -p codex-commit --test cli --no-run --locked
      - name: Check whether this crate version is already published
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/crate.json" -w '%{http_code}' \
            -H 'User-Agent: codex-commit-release (https://github.com/syz51/codex-commit)' \
            "https://crates.io/api/v1/crates/codex-commit/${GITHUB_REF_NAME#v}")
          case "$status" in
            200) jq -e --arg version "${GITHUB_REF_NAME#v}" '.version.num == $version' "$RUNNER_TEMP/crate.json"
                 echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) cat "$RUNNER_TEMP/crate.json"; exit 1 ;;
          esac
      - name: Authenticate to crates.io with GitHub OIDC
        id: auth
        if: steps.registry.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish exact tagged source
        if: steps.registry.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p codex-commit --locked
      - name: Verify public crate checksum and source commit
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 \
            -H 'User-Agent: codex-commit-release (https://github.com/syz51/codex-commit)' \
            "https://crates.io/api/v1/crates/codex-commit/$version" -o "$RUNNER_TEMP/crate.json"
          jq -e --arg version "$version" '.version.num == $version and (.version.checksum | test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/crate.json"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 \
            -H 'User-Agent: codex-commit-release (https://github.com/syz51/codex-commit)' \
            "https://crates.io/api/v1/crates/codex-commit/$version/download" -o "$RUNNER_TEMP/package.crate"
          printf '%s  %s\n' "$(jq -r '.version.checksum' "$RUNNER_TEMP/crate.json")" "$RUNNER_TEMP/package.crate" | sha256sum --check -
          tar -xOf "$RUNNER_TEMP/package.crate" "codex-commit-$version/.cargo_vcs_info.json" \
            | jq -e --arg sha "$RELEASE_SHA" '.git.sha1 == $sha and .git.dirty != true and .path_in_vcs == ""'
      - name: Install from public Cargo registry and test installed executable
        shell: bash
        run: |
          set -euo pipefail
          cargo install codex-commit --version "${GITHUB_REF_NAME#v}" --locked \
            --root "$RUNNER_TEMP/cargo-install" --target-dir "$RUNNER_TEMP/cargo-install-target"
          executable="$RUNNER_TEMP/cargo-install/bin/codex-commit"
          test "$(find "$RUNNER_TEMP/cargo-install/bin" -type f | wc -l)" -eq 1
          test "$("$executable" --version)" = "codex-commit ${GITHUB_REF_NAME#v}"
          "$executable" --help
          mkdir "$RUNNER_TEMP/dry-run"
          git -C "$RUNNER_TEMP/dry-run" init -b main
          "$executable" -C "$RUNNER_TEMP/dry-run" --dry-run
          CODEX_COMMIT_BIN="$executable" cargo test -p codex-commit --test cli --locked

  publish:
    name: Publish and verify immutable GitHub release
    needs: [draft, cargo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-stable-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Publish release after Cargo verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$RELEASE_ID" '
            .id == $id and .tag_name == $tag and .prerelease == false and
            ([.assets[].name] | sort == (["SHA256SUMS",
              "codex-commit-\($tag)-aarch64-apple-darwin.tar.gz",
              "codex-commit-\($tag)-x86_64-apple-darwin.tar.gz"] | sort))
          ' "$RUNNER_TEMP/release.json"
          if test "$(jq -r .draft "$RUNNER_TEMP/release.json")" = true; then
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '
              .[] | select(.draft == false and .prerelease == false) | .tag_name
              | select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
            ' > "$RUNNER_TEMP/published-tags"
            printf '%s\n' "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/published-tags"
            newest="$(LC_ALL=C sort -V "$RUNNER_TEMP/published-tags" | tail -1)"
            latest=false
            if test "$newest" = "$GITHUB_REF_NAME"; then latest=true; fi
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
          fi
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e --arg tag "$GITHUB_REF_NAME" --argjson id "$RELEASE_ID" \
            '.id == $id and .tag_name == $tag and .draft == false and .prerelease == false and .immutable == true'
          gh release verify "$GITHUB_REF_NAME"
          for asset in dist/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset"
          done
          printf 'Published %s: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REF_NAME" "$GH_REPO" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
