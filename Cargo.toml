[package]
name = "codex-commit"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
description = "Commit Git changes with Codex, with optional push"
license = "MIT"
repository = "https://github.com/syz51/codex-commit"
homepage = "https://github.com/syz51/codex-commit"
readme = "README.md"
authors = ["syz51"]
keywords = ["codex", "git", "commit", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "Cargo.lock", "src/**", "tests/**/*.rs", "README.md", "LICENSE"]

[workspace]
members = ["xtask"]
resolver = "3"

[dependencies]
tempfile = "3.27.0"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
clap_complete = "4.6.11"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"

[dev-dependencies]
nix = { version = "0.31.3", features = ["fs", "ioctl", "process", "signal", "term"] }
tempfile = "3.27.0"

[[example]]
name = "mock-codex"
path = "tests/support/mock_codex.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
